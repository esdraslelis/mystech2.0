name: Deploy Bilisco Portal

on:
  push:
    branches: ["bilisco-portal"]
    paths:
      - "bilisco-portal/**"
      - ".github/workflows/deploy-bilisco-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "bilisco-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Bilisco portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./bilisco-portal

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
