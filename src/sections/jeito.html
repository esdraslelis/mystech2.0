<section class="jeito" id="jeito" data-cena aria-labelledby="jeito-titulo">
  <div class="jeito__palco">
    <div class="jeito__trilho">
      <div class="jeito__abre">
        <h2 class="jeito__titulo display" id="jeito-titulo" data-justifica>
          <span class="linha"><span class="linha__t">Nosso</span></span>
          <span class="linha"><span class="linha__t">jeito</span></span>
        </h2>
      </div>

      <div class="jeito__entrada">
        <p class="jeito__frase">
          <span class="linha"><span class="linha__t">Poucas regras, levadas a sério,</span></span>
          <span class="linha"><span class="linha__t">guiam tudo o que a gente entrega:</span></span>
        </p>
      </div>

      <article class="painel painel--1">
        <h3 class="painel__texto display">
          <span class="painel__par"><span class="linha"><span class="linha__t">A gente</span></span><span class="linha"><span class="linha__t">escuta</span></span></span>
          <span class="painel__par"><span class="linha"><span class="linha__t">antes de</span></span><span class="linha"><span class="linha__t">programar</span></span></span>
        </h3>
        <div class="painel__capsula" aria-hidden="true"><img class="painel__foto" src="./img/retrato-1.webp" alt="" decoding="async" fetchpriority="low"></div>
      </article>

      <article class="painel painel--2">
        <h3 class="painel__texto display">
          <span class="painel__par"><span class="linha"><span class="linha__t">Um time só,</span></span></span>
          <span class="painel__par"><span class="linha"><span class="linha__t">lado a lado</span></span></span>
          <span class="painel__par"><span class="linha"><span class="linha__t">com você</span></span></span>
        </h3>
        <svg class="painel__nuvem" viewBox="0 0 100 100" aria-hidden="true">
          <defs><clipPath id="nuvem-time"><path d="M20.7 60C15.1 57.9 11.5 52.5 11.7 46.6C11.8 40.6 15.7 35.5 21.3 33.6C20.9 26.5 24.9 19.9 31.4 17C37.9 14 45.6 15.4 50.6 20.5C54.5 12.9 63.1 9 71.4 10.9C79.7 12.9 85.6 20.2 85.7 28.7C92.9 29.2 98.7 34.6 99.8 41.7C100.9 48.8 97 55.7 90.3 58.3C91.6 64.1 89.4 70 84.7 73.4C80 76.9 73.6 77.2 68.6 74.2C65.7 78.7 60.6 81.4 55.2 81.3C49.9 81.1 45 78.2 42.3 73.5C37.7 76.3 31.9 76.2 27.3 73.4C22.8 70.5 20.2 65.3 20.7 60Z"/></clipPath></defs>
          <image href="./img/time.webp" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#nuvem-time)"/>
          <g class="painel__bolinhas"><circle cx="12.73" cy="77.69" r="5.01"/><circle cx="2.86" cy="86.70" r="2.86"/></g>
        </svg>
      </article>

      <article class="painel painel--3">
        <h3 class="painel__texto display">
          <span class="painel__par"><span class="linha"><span class="linha__t">Entrega</span></span><span class="linha"><span class="linha__t">toda semana,</span></span></span>
          <span class="painel__par"><span class="linha"><span class="linha__t">não só</span></span><span class="linha"><span class="linha__t">no fim</span></span></span>
        </h3>
        <div class="painel__circulo" aria-hidden="true"></div>
        <img class="painel__recorte" src="./img/retrato-2.webp" alt="" decoding="async" fetchpriority="low">
      </article>

      <article class="painel painel--4">
        <h3 class="painel__texto display">
          <span class="painel__par"><span class="linha"><span class="linha__t">Quem faz</span></span><span class="linha"><span class="linha__t">responde</span></span></span>
          <span class="painel__par"><span class="linha"><span class="linha__t">pelo que</span></span><span class="linha"><span class="linha__t">entrega</span></span></span>
        </h3>
        <div class="painel__capsula" aria-hidden="true"><img class="painel__foto" src="./img/retrato-3.webp" alt="" decoding="async" fetchpriority="low"></div>
      </article>
    </div>
    <img class="jeito__aviao" src="./img/aviaozinho.webp" alt="" aria-hidden="true" width="416" height="189" decoding="async" fetchpriority="low">
  </div>
</section>
