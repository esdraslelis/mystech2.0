<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fff7f2" />
  <title>Conexão i9 Wi‑Fi | Bilisco</title>
  <meta name="description" content="Acesso Wi‑Fi fornecido pela Conexão i9 em parceria com o Bilisco." />
  <link rel="stylesheet" href="./assets.css" />
  <link rel="stylesheet" href="./mystech.css" />
  <link rel="stylesheet" href="./style.css?v=20261007-10" />
</head>
<body>
  <main class="page">
    <section class="access-card" aria-labelledby="title">
      <header class="brand">
        <span class="provider-label">Conexão fornecida por</span>
        <img class="i9-logo" src="./i9-logo-oficial.png?v=20261007-10" alt="Conexão i9 Telecomunicações" />
        <div class="partner">
          <span>em parceria com</span>
          <div class="logo-bilisco partner-logo" role="img" aria-label="Bilisco"></div>
        </div>
      </header>

      <div class="hero-copy">
        <span class="eyebrow">WI‑FI DO BILISCO</span>
        <h1 id="title">Conecte-se e aproveite.</h1>
        <p class="intro">Preencha seus dados para liberar o Wi‑Fi gratuito fornecido pela Conexão i9.</p>
      </div>

      <form id="access-form" novalidate>
        <div class="grid">
          <label>
            <span>Nome</span>
            <input id="firstName" name="firstName" autocomplete="given-name" minlength="2" maxlength="60" placeholder="Seu nome" required />
          </label>
          <label>
            <span>Sobrenome</span>
            <input id="lastName" name="lastName" autocomplete="family-name" minlength="2" maxlength="80" placeholder="Seu sobrenome" required />
          </label>
        </div>

        <label>
          <span>Celular com DDD</span>
          <input id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="(35) 99999-9999" maxlength="16" pattern="\([0-9]{2}\) 9[0-9]{4}-[0-9]{4}" required />
        </label>

        <label class="check">
          <input id="terms" type="checkbox" required />
          <span>Concordo com os <button type="button" class="link-button" data-modal="terms">Termos de Uso</button> e a <button type="button" class="link-button" data-modal="privacy">Política de Privacidade</button>.</span>
        </label>

        <button id="submit" class="primary" type="submit">
          <span class="button-label">Conectar ao Wi‑Fi</span>
          <span class="arrow" aria-hidden="true">→</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>

      <div class="trust-row">
        <span class="trust-dot">✓</span>
        <span>Acesso seguro • sessão de até 4 horas</span>
      </div>

      <footer>
        <span>Portal desenvolvido por</span>
        <i class="mystech-logo" aria-hidden="true"></i>
        <strong>Mys Tech</strong>
      </footer>
    </section>

    <div id="success-toast" class="success-toast" role="status" aria-live="polite" aria-hidden="true">
      <span class="success-icon">✓</span>
      <div>
        <strong>Conectado!</strong>
        <small>Seu acesso foi liberado. Boa navegação.</small>
      </div>
    </div>
  </main>

  <dialog id="legal-modal">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button id="close-modal" aria-label="Fechar">×</button>
    </div>
    <div id="modal-content" class="modal-content"></div>
  </dialog>

  <script src="./app.js?v=20261007-10"></script>
</body>
</html>
