<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Bilisco Wi‑Fi</title>
  <meta name="description" content="Acesso ao Wi‑Fi do Bilisco." />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="title">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">B</div>
        <div>
          <span class="eyebrow">WI‑FI BILISCO</span>
          <h1 id="title">Bem-vindo ao Bilisco</h1>
        </div>
      </div>

      <p class="intro">Preencha seus dados para liberar seu acesso à internet.</p>

      <div class="steps" aria-label="Etapas do acesso">
        <span class="step active"><b>1</b> Cadastro</span>
        <span class="line"></span>
        <span class="step"><b>2</b> Confirmação</span>
        <span class="line"></span>
        <span class="step"><b>3</b> Acesso</span>
      </div>

      <form id="access-form" novalidate>
        <div class="grid">
          <label>
            <span>Nome</span>
            <input id="firstName" name="firstName" autocomplete="given-name" maxlength="60" required />
          </label>
          <label>
            <span>Sobrenome</span>
            <input id="lastName" name="lastName" autocomplete="family-name" maxlength="80" required />
          </label>
        </div>

        <label>
          <span>Celular com DDD</span>
          <input id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="(35) 99999-9999" maxlength="16" required />
        </label>

        <label class="check">
          <input id="terms" type="checkbox" required />
          <span>Li e aceito os <button type="button" class="link-button" data-modal="terms">Termos de Uso</button> e a <button type="button" class="link-button" data-modal="privacy">Política de Privacidade</button>.</span>
        </label>

        <button id="submit" class="primary" type="submit">
          <span class="button-label">Liberar meu acesso</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>

      <footer>Tecnologia <strong>Mys Tech</strong></footer>
    </section>
  </main>

  <dialog id="legal-modal">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button id="close-modal" aria-label="Fechar">×</button>
    </div>
    <div id="modal-content" class="modal-content"></div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
